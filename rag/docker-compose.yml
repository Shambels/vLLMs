services:
  postgres:
    image: postgres:17
    container_name: rag_docker_container
    environment:
      POSTGRES_USER: pinch
      POSTGRES_PASSWORD: 'realpassword'
      POSTGRES_DB: ragdb
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
